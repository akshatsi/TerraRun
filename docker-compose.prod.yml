# Production stack. Run it with:
#
#   cp .env.example .env     # then fill in the values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Compared with docker-compose.yml: secrets come from .env, no source is
# mounted over the image, and the database port is not published.
#
# The mobile app needs an https:// address. For a server with a domain name,
# add the "https" profile: it starts Caddy, which gets and renews the
# certificate itself. Set DOMAIN in .env (and BACKEND_BIND=127.0.0.1):
#
#   docker compose -f docker-compose.prod.yml --profile https up -d --build

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrarun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-terrarun}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-terrarun}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-terrarun}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # HTTPS in front of the backend. Only starts with --profile https.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to backend:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
